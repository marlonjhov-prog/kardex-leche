<!DOCTYPE html>
<html>
<head>
    <title>Kardex Leche</title>
</head>
<body>
    <h2>Kardex de Leche</h2>
    <div id="status">Cargando...</div>
    <div id="app">
        <input type="date" id="f">
        <input type="number" id="c">
        <button onclick="guardar()">Guardar</button>
        <ul id="lista"></ul>
    </div>

    <script>
        const URL = "TU_URL_AQUI"; // PEGA TU URL DE APPS SCRIPT AQUÍ
        let datos = [];

        async function cargar() {
            try {
                let res = await fetch(URL);
                datos = await res.json();
                render();
                document.getElementById('status').innerText = "Conectado";
            } catch(e) {
                document.getElementById('status').innerText = "Error de conexión";
            }
        }

        async function guardar() {
            let n = { fecha: document.getElementById('f').value, cantidad: document.getElementById('c').value };
            datos.push(n);
            
            document.getElementById('status').innerText = "Guardando...";
            
            await fetch(URL, {
                method: "POST",
                mode: "no-cors", 
                body: JSON.stringify(datos)
            });
            
            document.getElementById('status').innerText = "Guardado con éxito";
            render();
        }

        function render() {
            let l = document.getElementById('lista');
            l.innerHTML = "";
            datos.forEach(d => l.innerHTML += `<li>${d.fecha}: ${d.cantidad} L</li>`);
        }

        cargar();
    </script>
</body>
</html>
