<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Kardex Avanzado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; }
        .kpi-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 20px; border-radius: 10px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        .btn-edit { background: #ffc107; border: none; padding: 5px 10px; cursor: pointer; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Panel de Control Kardex</h2>
    <div class="kpi-container">
        <div class="kpi-card"><h4>Ingreso Total (L)</h4><p id="kpiIngreso">0</p></div>
        <div class="kpi-card"><h4>Consumo Total (kg)</h4><p id="kpiConsumo">0</p></div>
        <div class="kpi-card"><h4>Restante (kg)</h4><p id="kpiRestante">0</p></div>
    </div>
    <div class="chart-container"><canvas id="kardexChart"></canvas></div>
    
    <button onclick="toggleTable()">Ver Historial de Días</button>
    <div id="tableSection" style="display:none; margin-top: 20px;">
        <table id="kardexTable">
            <thead>
                <tr><th>Día</th><th>Fecha</th><th>Ingreso (L)</th><th>Consumo (kg)</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
