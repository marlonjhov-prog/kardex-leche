<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Kardex Avanzado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; }
        h2 { text-align: center; color: #0056b3; }
        .kpi-container { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .kpi-card { background: white; padding: 20px; border-radius: 10px; flex: 1; min-width: 200px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; border-left: 5px solid #007bff; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Formulario para agregar registros */
        .form-container { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-container input, .form-container button { padding: 8px; margin: 5px; }
        .btn-add { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; font-size: 14px; }
        th { background-color: #f8f9fa; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .accordion-btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Panel de Control - Kardex de Leche</h2>
    
    <div class="kpi-container">
        <div class="kpi-card"><h4>Ingreso Total (L)</h4><p id="kpiIngreso" style="font-size:20px; font-weight:bold; color:#007bff;">0</p></div>
        <div class="kpi-card"><h4>Consumo Total (kg)</h4><p id="kpiConsumo" style="font-size:20px; font-weight:bold; color:#007bff;">0</p></div>
        <div class="kpi-card" style="border-left-color: #28a745;"><h4>Restante Actual (kg)</h4><p id="kpiRestante" style="font-size:20px; font-weight:bold; color:#28a745;">0</p></div>
    </div>

    <div class="chart-container"><canvas id="kardexChart"></canvas></div>

    <!-- Formulario para nuevo registro -->
    <div class="form-container">
        <h3>Agregar Nuevo Día de Consumo</h3>
        <input type="text" id="newDia" placeholder="Ej: Día 18">
        <input type="date" id="newFecha">
        <input type="number" id="newIngreso" placeholder="Ingreso (L)">
        <input type="number" step="0.001" id="newConsumo" placeholder="Consumo (kg)">
        <button class="btn-add" onclick="addNewItem()">Añadir Registro</button>
    </div>
    
    <button class="accordion-btn" onclick="toggleTable()">Ver / Ocultar Historial de Días</button>
    
    <div id="tableSection" style="display:none; margin-top: 15px;">
        <table>
            <thead>
                <tr><th>Día</th><th>Fecha</th><th>Ingreso (L)</th><th>Consumo (kg)</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
