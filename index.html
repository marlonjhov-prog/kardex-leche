<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Kardex - Leche</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; color: #333; max-width: 1200px; margin: auto; }
        h2 { text-align: center; color: #0056b3; }
        .kpi-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .kpi-card { background: white; padding: 15px; border-radius: 10px; flex: 1; min-width: 180px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; border-left: 5px solid #007bff; }
        .charts-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .chart-container { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 320px; flex: 2; min-width: 300px; }
        .gauge-container { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: 320px; flex: 1; min-width: 250px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .form-container { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-container input, .form-container button { padding: 8px; margin: 5px; }
        .btn-add { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; font-size: 13px; }
        th { background-color: #f8f9fa; }
        button { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-save { background: #17a2b8; color: white; display: none; }
        .btn-delete { background: #dc3545; color: white; }
        .accordion-btn { background: #007bff; color: white; padding: 10px 15px; border-radius: 5px; font-weight: bold; width: 100%; text-align: left; cursor: pointer; border: none; }
        #syncStatus { text-align: center; font-size: 13px; margin-bottom: 15px; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>
    <h2>Panel Base de Datos - Kardex de Leche</h2>
    <div id="syncStatus">Conectando a la base de datos en Google Sheets...</div>
    
    <!-- 4 TARJETAS KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-left-color: #6c757d;"><h4>Meta a Cumplir</h4><p id="kpiMeta" style="font-size:18px; font-weight:bold; color:#6c757d;">0</p></div>
        <div class="kpi-card"><h4>Ingreso Total (L)</h4><p id="kpiIngreso" style="font-size:18px; font-weight:bold; color:#007bff;">0</p></div>
        <div class="kpi-card"><h4>Consumo Equivalente (kg)</h4><p id="kpiConsumo" style="font-size:18px; font-weight:bold; color:#007bff;">0</p></div>
        <div class="kpi-card" style="border-left-color: #28a745;"><h4>Restante Meta (kg)</h4><p id="kpiRestante" style="font-size:18px; font-weight:bold; color:#28a745;">0</p></div>
    </div>

    <!-- FILA DE GRÁFICAS -->
    <div class="charts-row">
        <div class="chart-container">
            <canvas id="kardexChart"></canvas>
        </div>
        <div class="gauge-container">
            <h4 style="margin:0; color:#555; font-size: 14px;">Velocímetro de Meta</h4>
            <div style="position: relative; height: 220px; width: 100%;">
                <canvas id="gaugeChart"></canvas>
            </div>
            <p id="gaugeText" style="margin:0; font-weight:bold; color:#007bff; font-size: 14px;">0% completado</p>
        </div>
    </div>

    <div class="form-container">
        <h3>Registrar Nuevo Ingreso a la Base de Datos</h3>
        <input type="date" id="newFecha">
        <input type="number" step="any" id="newCantidad" placeholder="Cantidad (Litros)">
        <button class="btn-add" onclick="addNewItem()">Guardar</button>
    </div>
    
    <button class="accordion-btn" onclick="toggleTable()">Historial Registrado en la Nube</button>
    
    <div id="tableSection" style="display:none; margin-top: 15px;">
        <table>
            <thead>
                <tr><th>Día</th><th>Fecha</th><th>Cantidad (L)</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZrjjen_BaUte8ez3w8184M9v-Igu0XXosQLjMZwRwlev-OmkwECos-PrwwrGjY6E2HQ/exec";
        
        const META_TOTAL_KG = 21981; 
        const RATIO_L_POR_KG = 9;   

        let kardexData = [];
        let myChart = null;
        let gaugeChart = null;

        function formatKPI(num) {
            return num.toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function loadFromGoogleSheets() {
            try {
                let response = await fetch(WEB_APP_URL);
                let result = await response.json();
                if (Array.isArray(result)) {
                    kardexData = result;
                    document.getElementById('syncStatus').innerText = `✔ Conectado a Google Sheets (${kardexData.length} registros)`;
                    document.getElementById('syncStatus').style.color = "green";
                }
                renderApp();
            } catch (error) {
                document.getElementById('syncStatus').innerText = "❌ Error al conectar con Google Sheets.";
                document.getElementById('syncStatus').style.color = "red";
                renderApp();
            }
        }

        async function saveToGoogleSheets() {
            document.getElementById('syncStatus').innerText = "Sincronizando con Google Sheets...";
            document.getElementById('syncStatus').style.color = "orange";

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(kardexData)
                });
                document.getElementById('syncStatus').innerText = `✔ Base de datos actualizada (${kardexData.length} registros)`;
                document.getElementById('syncStatus').style.color = "green";
            } catch (error) {
                document.getElementById('syncStatus').innerText = "❌ Error al guardar en la nube.";
                document.getElementById('syncStatus').style.color = "red";
            }
        }

        function renderApp() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let totalIngresoL = 0;
            
            if (kardexData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:#777; padding:15px;">No hay registros en la base de datos todavía. Añade el primero arriba.</td></tr>`;
            }

            kardexData.forEach((item, index) => {
                let cantidadL = Number(String(item.cantidad).replace(/'/g, '')) || 0;
                totalIngresoL += cantidadL;
                let numeroDia = `Día ${index + 1}`;
                
                tbody.innerHTML += `<tr>
                    <td>${numeroDia}</td>
                    <td>${item.fecha}</td>
                    <td><input type="number" step="any" id="cant_${index}" value="${cantidadL}" disabled style="width:100px"></td>
                    <td>
                        <button class="btn-edit" id="btnEdit_${index}" onclick="enableEdit(${index})">Modificar</button>
                        <button class="btn-save" id="btnSave_${index}" onclick="saveEdit(${index})">Guardar</button>
                        <button class="btn-delete" onclick="deleteItem(${index})">Eliminar</button>
                    </td>
                </tr>`;
            });

            let totalConsumoEqKg = totalIngresoL / RATIO_L_POR_KG;
            let restanteKg = Math.max(0, META_TOTAL_KG - totalConsumoEqKg);

            document.getElementById('kpiMeta').innerText = formatKPI(META_TOTAL_KG) + " kg";
            document.getElementById('kpiIngreso').innerText = formatKPI(totalIngresoL) + " L";
            document.getElementById('kpiConsumo').innerText = formatKPI(totalConsumoEqKg) + " kg";
            document.getElementById('kpiRestante').innerText = formatKPI(restanteKg) + " kg";
            
            updateCharts(totalConsumoEqKg);
        }

        function enableEdit(index) {
            document.getElementById(`cant_${index}`).disabled = false;
            document.getElementById(`btnEdit_${index}`).style.display = 'none';
            document.getElementById(`btnSave_${index}`).style.display = 'inline-block';
        }

        function saveEdit(index) {
            let nuevaCantidad = document.getElementById(`cant_${index}`).value;
            kardexData[index].cantidad = parseFloat(nuevaCantidad) || 0;
            renderApp();
            saveToGoogleSheets();
        }

        function addNewItem() {
            let fechaRaw = document.getElementById('newFecha').value;
            // Limpiamos la fecha para extraer estrictamente YYYY-MM-DD y evitar la hora UTC
            const fecha = fechaRaw ? fechaRaw.split('T')[0] : '';
            const cantidad = parseFloat(document.getElementById('newCantidad').value) || 0;

            if (!fecha || isNaN(cantidad)) {
                alert("Por favor selecciona una fecha y escribe una cantidad válida.");
                return;
            }

            kardexData.push({ fecha, cantidad });
            
            document.getElementById('newFecha').value = '';
            document.getElementById('newCantidad').value = '';

            renderApp();
            saveToGoogleSheets();
        }

        function deleteItem(index) {
            if (confirm("¿Estás seguro de eliminar este registro de la base de datos?")) {
                kardexData.splice(index, 1);
                renderApp();
                saveToGoogleSheets();
            }
        }

        function updateCharts(totalConsumoEqKg) {
            const ctxLine = document.getElementById('kardexChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            let acumuladoTemp = 0;
            let labelsArray = [];
            let datosAcumulados = [];
            let datosMetaFija = [];

            kardexData.forEach((i, idx) => {
                let cantClean = Number(String(i.cantidad).replace(/'/g, '')) || 0;
                acumuladoTemp += cantClean / RATIO_L_POR_KG;
                labelsArray.push(`Día ${idx + 1}`);
                datosAcumulados.push(acumuladoTemp);
                datosMetaFija.push(META_TOTAL_KG);
            });

            if(labelsArray.length === 0) {
                labelsArray = ['Día 1'];
                datosAcumulados = [0];
                datosMetaFija = [META_TOTAL_KG];
            }

            myChart = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: labelsArray,
                    datasets: [
                        {
                            label: 'Avance Acumulado (kg)',
                            data: datosAcumulados,
                            borderColor: '#28a745',
                            backgroundColor: 'rgba(40, 167, 69, 0.1)',
                            fill: true,
                            tension: 0.1
                        },
                        {
                            label: 'Meta Objetivo (21.981 kg)',
                            data: datosMetaFija,
                            borderColor: '#dc3545',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: 'Progreso Diario vs Línea de Meta (kg)' }
                    }
                }
            });

            const ctxGauge = document.getElementById('gaugeChart').getContext('2d');
            if(gaugeChart) gaugeChart.destroy();

            let porcentaje = Math.min(100, (totalConsumoEqKg / META_TOTAL_KG) * 100);
            let restantePorcentaje = 100 - porcentaje;

            let colorProgreso = '#007bff'; // Azul (< 40%)
            if (porcentaje >= 80) {
                colorProgreso = '#28a745'; // Verde (>= 80%)
            } else if (porcentaje >= 40) {
                colorProgreso = '#ffc107'; // Naranja (Entre 40% y 79.9%)
            }

            const gaugeTextEl = document.getElementById('gaugeText');
            gaugeTextEl.innerText = `${porcentaje.toFixed(2)}% completado`;
            gaugeTextEl.style.color = colorProgreso;

            gaugeChart = new Chart(ctxGauge, {
                type: 'doughnut',
                data: {
                    labels: ['Consumido', 'Restante'],
                    datasets: [{
                        data: [porcentaje, restantePorcentaje],
                        backgroundColor: [colorProgreso, '#e9ecef'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    circumference: 180,
                    rotation: 270,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataIndex === 0 ? 
                                        ` Consumido: ${porcentaje.toFixed(2)}%` : 
                                        ` Restante: ${restantePorcentaje.toFixed(2)}%`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function toggleTable() {
            const s = document.getElementById('tableSection');
            s.style.display = s.style.display === 'none' ? 'block' : 'none';
        }

        loadFromGoogleSheets();
    </script>
</body>
</html>
